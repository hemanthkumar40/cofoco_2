    E.register = function (p) {

    /* ----- Commission ledger and payouts ----- */

    E.payoutQueue = function () {

    E.markPayoutPaid = function (payoutId, reference, dateMs) {

    /* ----- Inventory operations ----- */
    E.adjust = function (p) {

      const e = addEntry({ sku: p.sku, batchId: b.id, qty: delta, type: 'adjustment', reason: String(p.reason).trim() + (p.note ? ': ' + p.note : ''), ref: null, by: p.by || 'Staff' });

    E.writeOff = function (batchId, reason, by) {

    E.createPO = function (supplierId, lines) {

      if (!ls.length) return err('empty', 'Add at least one item from this supplier.');

    E.receivePO = function (poId, receipts) {

        }

    function velocity() {
      const from = now() - 7 * DAY, v = {};

      for (const k in v) v[k] = v[k] / 7; return v;
    }
    function statusOf(it, st) {
      if (st.available === 0) return 'out';
      if (st.available <= it.rp) return 'low';
      return 'ok';
    }
    E.inventoryRows = function (f) {
      f = f || {}; const vel = velocity(); const q = String(f.search || '').trim().toLowerCase();
      let rows = S.items.map(it => {
        const st = itemStock(it.sku), sup = S.suppliers.find(s => s.id === it.supplierId); const perDay = vel[it.sku] || 0;
        return { item: it, stock: st, supplier: sup, status: statusOf(it, st), expiredQty: st.expiredQty, expiringQty: st.expiringQty, daysOfCover: perDay > 0 ? st.available / perDay : null, perDay, gap: Math.max(0, it.rp - st.available) };
      });
      const all = rows.length;
      if (q) rows = rows.filter(r => r.item.name.toLowerCase().includes(q) || r.item.sku.toLowerCase().includes(q));
      if (f.type && f.type !== 'all') rows = rows.filter(r => r.item.type === f.type);
      if (f.status && f.status !== 'all') rows = rows.filter(r => f.status === 'expiring' ? r.expiringQty > 0 : f.status === 'expired' ? r.expiredQty > 0 : f.status === 'low' ? (r.status === 'low' || r.status === 'out') : r.status === f.status);
      const sort = f.sort || 'name';
      rows.sort((a, b) => sort === 'available' ? a.stock.available - b.stock.available : sort === 'cover' ? (a.daysOfCover == null ? Infinity : a.daysOfCover) - (b.daysOfCover == null ? Infinity : b.daysOfCover) : a.item.name.localeCompare(b.item.name));
      return { rows, total: all, totals: valuation(rows) };
    };
    function valuation(rows) {
      const byType = {}; let units = 0, retail = 0, cost = 0, expiredRetail = 0;
      for (const r of rows) {
        const sellable = r.stock.onHand - r.stock.expiredQty, t = r.item.type;
        byType[t] = byType[t] || { items: 0, units: 0, retail: 0, cost: 0 };
        byType[t].items++; byType[t].units += sellable; byType[t].retail += sellable * r.item.price; byType[t].cost += sellable * r.item.cost;
        units += sellable; retail += sellable * r.item.price; cost += sellable * r.item.cost; expiredRetail += r.stock.expiredQty * r.item.price;
      }

    }
    E.valuation = () => valuation(E.inventoryRows().rows);
    E.reorderAlerts = function () {

    };

      return out.sort((a, b) => (a.batch.expiry) - (b.batch.expiry));

    E.suppliers = () => S.suppliers.map(s => ({ ...s, items: S.items.filter(i => i.supplierId === s.id), openPOs: S.purchaseOrders.filter(p => p.supplierId === s.id && p.status === 'ordered').length }));
    E.purchaseOrders = () => S.purchaseOrders.slice().sort((a, b) => b.createdAt - a.createdAt);

    /* ----- Reports ----- */
    const live = o => o.status !== 'cancelled';
    E.sourceOptions = () => [{ id: 'all', label: 'All sources' }, { id: 'direct', label: 'Direct (no code)' }, { id: 'referred', label: 'All referred' }].concat(S.influencers.map(i => ({ id: i.id, label: i.name })));
    function matchSource(o, source) {
      if (!source || source === 'all') return true; if (source === 'direct') return !o.referral; if (source === 'referred') return !!o.referral; return !!o.referral && o.referral.influencerId === source;
    }
    E.salesReport = function (f) {
      f = f || {}; const t = now();
      const from = f.from != null ? f.from : startOfDay(t - 7 * DAY), to = f.to != null ? f.to : t;
      const placed = S.orders.filter(o => o.createdAt >= from && o.createdAt <= to && matchSource(o, f.source));
      const liveO = placed.filter(live);

/* ---------- Artwork ---------- */
function motifSvg(m, a) {
  const g = (inner, extra) => `<g fill="none" stroke="${a}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra || ''}>${inner}</g>`;
  const wave = (y, o) => `<path d="M105 ${y}q22-10 45 0t45 0t45 0t45 0t30 0" opacity="${o}"/>`;
  if (m === 'moon') return g(`<path d="M232 84a64 64 0 1 0 30 104a52 52 0 1 1 -30 -104z"/>${wave(214, 0.7)}${wave(232, 0.4)}<circle cx="276" cy="96" r="2.5" fill="${a}"/><circle cx="300" cy="126" r="1.8" fill="${a}"/>`);
  if (m === 'mountain') return g(`<path d="M86 224 L168 108 L214 172 L250 128 L324 224 Z"/><path d="M168 108 l-24 36 l24 -10 l22 15" opacity=".6"/><path d="M96 238h220" opacity=".4"/>`);
  if (m === 'sun') { let r = ''; for (let i = 0; i < 16; i++) { const t = i * Math.PI / 8, x1 = 200 + Math.cos(t) * 46, y1 = 148 + Math.sin(t) * 46, x2 = 200 + Math.cos(t) * (i % 2 ? 62 : 74), y2 = 148 + Math.sin(t) * (i % 2 ? 62 : 74); r += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}"/>`; } return g(`<circle cx="200" cy="148" r="34"/>${r}`); }
  if (m === 'lotus') { let p = ''; [-64, -32, 0, 32, 64].forEach(an => { p += `<ellipse cx="200" cy="140" rx="17" ry="50" transform="rotate(${an} 200 196)"/>`; }); return g(`${p}${wave(212, 0.7)}${wave(230, 0.4)}`); }
  if (m === 'rose') return g(`<circle cx="200" cy="148" r="12"/><circle cx="200" cy="148" r="26" stroke-dasharray="46 14"/><circle cx="200" cy="148" r="41" stroke-dasharray="70 18" transform="rotate(30 200 148)"/><circle cx="200" cy="148" r="58" stroke-dasharray="100 24" transform="rotate(70 200 148)"/>`);
  if (m === 'olive') { let l = ''; for (let i = 1; i <= 6; i++) { const t = i / 7, x = (1 - t) * (1 - t) * 128 + 2 * (1 - t) * t * 200 + t * t * 284, y = (1 - t) * (1 - t) * 218 + 2 * (1 - t) * t * 158 + t * t * 92, s = i % 2 ? -1 : 1; l += `<ellipse cx="${(x + s * 12).toFixed(1)}" cy="${(y - s * 12).toFixed(1)}" rx="8" ry="20" transform="rotate(${s * 40 + 28} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; } return g(`<path d="M128 218Q200 158 284 92"/>${l}`); }
  return '';
}
function itemGlyph(p) {
  const a = '#c9a24f', g = i => `<g fill="none" stroke="${a}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9">${i}</g>`;
  if (p.itemType === 'supplement') return g('<rect x="156" y="112" width="88" height="112" rx="14"/><rect x="164" y="90" width="72" height="24" rx="6"/><path d="M156 150h88M156 190h88" opacity=".5"/>');
  if (p.itemType === 'equipment') return g('<rect x="110" y="116" width="180" height="76" rx="38"/><path d="M146 116v76M254 116v76" opacity=".5"/>');
  return g('<ellipse cx="200" cy="150" rx="78" ry="44"/><ellipse cx="200" cy="150" rx="50" ry="24"/>');
}
let artSeq = 0;
function plate(motif, accent, label, name) {
  const gid = 'pg' + (++artSeq);
  return `<svg viewBox="0 0 400 300" role="img" aria-label="${esc(name)} artwork" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="${gid}" cx="64%" cy="40%" r="72%"><stop offset="0" stop-color="#8a5a1e" stop-opacity=".8"/><stop offset=".55" stop-color="#2a1c0d"/><stop offset="1" stop-color="#0d0a07"/></radialGradient></defs><rect width="400" height="300" fill="url(#${gid})"/>${motif}<path d="M20 262h40" stroke="${accent}" stroke-width="2"/><text x="20" y="282" fill="#e6c981" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2.4">${esc(label)}</text></svg>`;
}
function art(p) {
  const ch = p.characterId ? char(p.characterId) : null;
  if (ch) return plate(motifSvg(ch.motif, ch.accent), ch.accent, 'KIT · ' + ch.name.toUpperCase(), p.name);
  return plate(itemGlyph(p), '#c9a24f', (p.itemType || '').toUpperCase() + ' · ' + p.sku, p.name);
}
function charArt(ch) { return plate(motifSvg(ch.motif, ch.accent), ch.accent, ch.name.toUpperCase() + ' BY COFOCO', ch.name); }

/* ---------- Dashboard views ---------- */
const TABS = {
  founder: [['overview', 'Overview'], ['inventory', 'Inventory'], ['sales', 'Sales'], ['engagement', 'Engagement'], ['settlements', 'Settlements'], ['orders', 'Orders'], ['influencers', 'Influencers']],

function tile(k, v, d, gold) { return `<div class="tile"><span class="k">${k}</span><span class="v ${gold ? 'gold' : ''}">${v}</span>${d ? `<span class="d">${d}</span>` : ''}</div>`; }
function hbars(rows, fmt) {
  const max = Math.max(1, ...rows.map(r => r.value));
  return rows.map(r => `<div class="hbar"><span>${r.label}</span><span class="track"><span class="fill" style="width:${(r.value / max * 100).toFixed(1)}%;display:block;${r.color ? `--c:${r.color}` : ''}"></span></span><span class="num">${fmt(r.value)}</span></div>`).join('');
}
function barChart(days) {
  const W = 640, H = 250, L = 54, B = 30, T = 14, R = 10; const maxV = Math.max(1, ...days.map(d => d.revenue));
  const step = Math.pow(10, Math.floor(Math.log10(maxV))), nice = Math.ceil(maxV / step) * step; const top = nice * (maxV / nice > 0.8 ? 1 : 1);
  const ticks = [0, 1, 2, 3, 4].map(i => nice * i / 4), bw = (W - L - R) / days.length;
  const y = v => T + (H - T - B) * (1 - v / nice);
  const fmt = v => v >= 100000 ? (v / 100000).toFixed(1).replace('.0', '') + 'L' : v >= 1000 ? (v / 1000).toFixed(0) + 'k' : String(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net revenue by day for the last 7 days" width="100%"><g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
  ${ticks.map(t => `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join('')}
  ${days.map((d, i) => { const x = L + i * bw + bw * 0.18, w = bw * 0.64, yy = y(d.revenue); const last = i === days.length - 1; return `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, H - B - yy).toFixed(1)}" rx="3" fill="${last ? '#e6c981' : '#c9a24f'}"><title>${esc(d.label)}: ${inr(d.revenue)} from ${d.orders} orders</title></rect><text x="${(x + w / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle">${esc(d.label.replace(',', ''))}</text>`; }).join('')}</svg>`;
}

/* ---------- Modals ---------- */
function modalHtml() {
  const m = U.modal; if (!m) return '';
  const wrap = (title, body) => `<div class="overlay" data-act="closeModal" data-overlay="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="row sb"><h3 id="mTitle">${esc(title)}</h3><button class="chip" data-act="closeModal" aria-label="Close dialog">Close</button></div>${body}</div></div>`;
  const msg = m.error ? `<div class="msg bad" role="alert">${esc(m.error)}</div>` : '';
  if (m.type === 'reset') return wrap('Reset demo data?', `<p class="muted">Every order, stock change, signup, commission and payout you made returns to the seeded week. This cannot be undone.</p><div class="row"><button class="btn" data-act="doReset">Reset now</button><button class="btn btn-o" data-act="closeModal">Keep my changes</button></div>`);
  if (m.type === 'confirm') return wrap(m.title, `<p class="muted">${esc(m.text)}</p><div class="row"><button class="btn btn-danger" data-act="${m.act}" data-id="${esc(m.id)}" data-to="${esc(m.to || '')}">${esc(m.confirm)}</button><button class="btn btn-o" data-act="closeModal">Go back</button></div>`);
  if (m.type === 'adjust') { const it = E.item(m.sku), st = E.itemStock(m.sku); return wrap('Adjust ' + it.name, `<form class="stack" data-form="adjust" novalidate><label class="f"><span>Batch</span><select id="adjBatch" name="batchId">${st.batches.map(b => `<option value="${b.id}" ${m.batchId === b.id ? 'selected' : ''}>${esc(b.lot)} · ${b.onHand} on hand${b.expired ? ' · expired' : ''}</option>`).join('')}</select></label>
  <label class="f"><span>Change (steps of 5)</span><input id="adjDelta" name="delta" type="number" step="5" value="${m.delta}"></label><label class="f"><span>Reason (required)</span><select id="adjReason" name="reason"><option value="">Choose a reason</option>${E.catalog.adjustReasons.map(r => `<option ${m.reason === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label><label class="f"><span>Note (optional)</span><input id="adjNote" name="note"></label>${msg}<div class="row"><button class="btn" type="submit">Save adjustment</button><button class="btn btn-o" type="button" data-act="closeModal">Cancel</button></div></form>`); }
  if (m.type === 'reverse') return wrap('Reverse this entry', `<form class="stack" data-form="reverse" novalidate><p class="muted">The original line stays in the ledger and is marked reversed. Earned and pending totals fall.</p><label class="f"><span>Reason (required)</span><input id="revReason" name="reason" placeholder="e.g. Fake signup, order cancelled"></label>${msg}<div class="row"><button class="btn btn-danger" type="submit">Reverse entry</button><button class="btn btn-o" type="button" data-act="closeModal">Cancel</button></div></form>`);
  if (m.type === 'payout') { const q = E.payoutQueue().find(x => x.influencer.id === m.id); const inf = E.influencer(m.id); const today = new Date().toISOString().slice(0, 10);
    if (!q) return wrap('Record payout', `<p class="muted">Nothing is waiting for payout for ${esc(inf.name)}. It may already be recorded.</p><button class="btn btn-o" data-act="closeModal">Close</button>`);
    return wrap('Record payout for ' + inf.name, `<form class="stack" data-form="payout" novalidate><div class="row sb"><span class="muted">${q.entries.length} approved entries</span><span class="price">${inr2(q.amount)}</span></div><label class="f"><span>Bank or UPI reference (required)</span><input id="payRef" name="reference" placeholder="e.g. NEFT-2611-001"></label><label class="f"><span>Paid on</span><input id="payDate" name="date" type="date" value="${today}"></label><p class="muted" style="font-size:12.5px">Entries become paid. Recording the same payout again changes nothing.</p>${msg}<div class="row"><button class="btn" type="submit">Mark as paid</button><button class="btn btn-o" type="button" data-act="closeModal">Cancel</button></div></form>`); }
  if (m.type === 'receivePO') { const po = E.purchaseOrders().find(p => p.id === m.id);
    return wrap('Receive ' + po.id, `<form class="stack" data-form="receivePO" novalidate>${po.lines.map(l => { const it = E.item(l.sku), sup = it.type === 'supplement'; return `<div class="card stack-s"><b class="tt">${l.qty} x ${esc(it.name)}</b>${sup ? `<div class="fgrid"><label class="f"><span>Batch or lot (required)</span><input name="lot_${l.sku}" id="lot_${l.sku}"></label><label class="f"><span>Made on</span><input name="mfg_${l.sku}" type="date"></label><label class="f"><span>Expiry (required)</span><input name="exp_${l.sku}" type="date" id="exp_${l.sku}"></label></div>` : '<span class="muted">No batch data needed. Stock increases through the ledger.</span>'}</div>`; }).join('')}${msg}<div class="row"><button class="btn" type="submit">Receive stock</button><button class="btn btn-o" type="button" data-act="closeModal">Cancel</button></div></form>`); }
  if (m.type === 'newCode') return wrap('Add a code', `<form class="stack" data-form="newCodeFor" novalidate><label class="f"><span>New code</span><input id="ncCode" name="code" placeholder="NAME-OFFER10" autocomplete="off" data-live="modalcode"></label><div id="modalCodeMsg" role="status" aria-live="polite"></div>${msg}<div class="row"><button class="btn" type="submit">Add code</button><button class="btn btn-o" type="button" data-act="closeModal">Cancel</button></div></form>`);
  return '';
}

/* ---------- Router, events, boot ---------- */
function parseRoute() {
  const h = (location.hash || '#home').slice(1) || 'home';
  if (h.startsWith('kit-') || h.startsWith('item-')) return { name: 'product', id: h };
  if (h.startsWith('character-')) return { name: 'character', id: h.slice(10) };
  if (h.startsWith('founder-')) return { name: 'founder', tab: h.slice(8) };
  if (h.startsWith('join-')) return { name: 'join', code: h.slice(5) };
  return { name: h };
}
function gate(r, roles) {
  return `<section class="section wrap" style="border:0">${emptyState('This view is for the ' + roles + ' role', 'Use View as at the top of the page to switch roles in the demo.', '<button class="btn" data-act="toFounder" data-tab="overview">Switch to Founder</button>')}</section>`;
}
function viewFor(r) {
  switch (r.name) {
    case 'home': return viewHome();
    case 'shop': return viewShop();
    case 'characters': return viewCharacters();
    case 'character': return viewCharacter(r.id);
    case 'product': return viewProduct(r.id);
    case 'compare': return viewCompare();
    case 'cart': return viewCart();
    case 'checkout': return viewCheckout();
    case 'confirmation': return viewConfirmation();
    case 'track': return viewTrack();
    case 'register': return viewRegister();
    case 'about': return viewAbout();
    case 'portal': return U.role === 'influencer' ? viewInfluencerPortal() : gate(r, 'Influencer');
    case 'founder': {
      if (U.role !== 'founder' && U.role !== 'staff') return gate(r, 'Founder or Staff');
      const allowed = TABS[U.role === 'staff' ? 'staff' : 'founder'].map(t => t[0]);
      if (!allowed.includes(r.tab)) return `<section class="section wrap" style="border:0">${emptyState('Founder only', 'Sales, settlements and influencers are visible to the Founder role. Switch role at the top.', '<a class="btn btn-o" href="#founder-overview">Back to overview</a>')}</section>`;
      return ({ overview: viewOverview, inventory: viewInventory, sales: viewSales, engagement: viewEngagement, settlements: viewSettlements, orders: viewOrders, influencers: viewInfluencers })[r.tab]();
    }
    default: return emptyState('Page not found', 'That address does not exist.', '<a class="btn" href="#home">Go home</a>');
  }
}
let current = null;
function render(keepScroll) {
  const r = parseRoute(); current = r;
  if (r.name === 'join') { const v = E.recordLinkVisit(r.code); if (v.ok) { U.pendingCode = v.code.code; U.regForm = Object.assign({}, U.regForm, { code: v.code.code }); } else { U.regForm = Object.assign({}, U.regForm, { code: r.code }); } U.regResult = null; save(); location.replace('#register'); return; }
  const y = window.scrollY;
  document.getElementById('demo').innerHTML = demoBar();
  document.getElementById('nav').innerHTML = navHtml(r);
  document.getElementById('app').innerHTML = viewFor(r);
  document.getElementById('foot').innerHTML = r.name === 'founder' || r.name === 'portal' ? '' : footerHtml();
  renderModal(); if (keepScroll) window.scrollTo(0, y);
  const t = document.querySelector('h1'); document.title = 'COFOCO';
}
function renderModal() { document.getElementById('modal').innerHTML = modalHtml(); const f = document.querySelector('#modal input:not([type=hidden]), #modal select, #modal .btn'); if (U.modal && f && !U._focused) { f.focus(); U._focused = true; } if (!U.modal) U._focused = false; }
let toastT;
function toast(msg, bad) { const el = document.getElementById('toast'); el.innerHTML = `<div class="toast ${bad ? 'bad' : ''}" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => { el.innerHTML = ''; }, 3200); }
function go(h) { if (location.hash === h) render(); else location.hash = h; }
function refresh() { save(); render(true); }
function openModal(m) { U.modal = m; U._focused = false; renderModal(); }
function closeModal() { U.modal = null; renderModal(); }
const fd = form => Object.fromEntries(new FormData(form).entries());
function track(el, ev) {
  const a = el.closest('[data-area]'); if (!a) return;
  const h = Math.max(document.documentElement.scrollHeight, 1);
  E.track(a.dataset.area, ev.clientX / Math.max(window.innerWidth, 1), (window.scrollY + ev.clientY) / h);
}
function copyText(text, okMsg) {
  const fallback = () => { openModal({ type: 'copy', text }); };
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => toast(okMsg || 'Copied'), fallback); } else fallback(); } catch (e) { fallback(); }
}
const toMs = (v, noon) => v ? new Date(v + (noon ? 'T12:00:00' : 'T00:00:00')).getTime() : null;

const ACT = {
  role(v) { if (v === 'shopper') { U.role = 'shopper'; go('#home'); } else if (v === 'founder' || v === 'staff') { U.role = v; go('#founder-overview'); } else if (v.startsWith('influencer:')) { U.role = 'influencer'; U.infId = v.split(':')[1]; go('#portal'); } save(); render(); },
  toFounder(el) { if (U.role === 'shopper' || U.role === 'influencer') U.role = 'founder'; go('#founder-' + (el.dataset.tab || 'overview')); save(); },
  scrollTo(el) { U.entry = el.dataset.entry || U.entry; const t = document.getElementById(el.dataset.target); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  entry(el) { U.entry = el.dataset.entry || 'shop'; },
  pick(el) { U.pickerChar = el.dataset.id; render(true); },
  openReset() { openModal({ type: 'reset' }); },
  closeModal(el, ev) { if (el.dataset.overlay && ev.target !== el) return; closeModal(); },
  doReset() { E.reset(); U.cart = []; U.reservationId = null; U.pendingCode = null; U.userId = null; U.compare = []; U.lastOrderId = null; U.regResult = null; U.regForm = {}; U.form = {}; U.modal = null; U.inf.sel = null; U.ord.open = null; U.inv.open = {}; U.sales.source = 'all'; save(); try { localStorage.setItem(KEY, JSON.stringify(E.state())); } catch (e) { } render(); toast('Demo data reset to the seeded week'); },
  applycode(el, ev) { },
  clearCode() { U.pendingCode = null; U.codeMsg = null; refresh(); },
  shopChar(el) { U.shopChar = el.dataset.id; render(true); },
  essType(el) { U.essType = el.dataset.id; render(true); },
  cmp(el) { const id = el.dataset.id, i = U.compare.indexOf(id); if (i >= 0) U.compare.splice(i, 1); else if (U.compare.length >= 3) { toast('You can compare up to three kits. Remove one first.', true); return; } else U.compare.push(id); refresh(); },
  clearCmp() { U.compare = []; refresh(); },
  add(el) {
    const id = el.dataset.id, av = E.productAvailability(id); if (!av || av.sellable === 0) { toast('That item is out of stock', true); return; }
    const l = U.cart.find(x => x.productId === id); const q = (l ? l.qty : 0) + 1;
    if (q > av.sellable) { toast('Only ' + av.sellable + ' available', true); return; }
    if (l) l.qty = q; else U.cart.push({ productId: id, qty: 1 }); U.cartArea = el.dataset.area || 'shop'; U.cartError = null; refresh(); toast('Added to your bag');
  },
  qty(el) { const id = el.dataset.id, d = Number(el.dataset.d), l = U.cart.find(x => x.productId === id); if (!l) return; const av = E.productAvailability(id); const q = l.qty + d; if (q < 1) { U.cart = U.cart.filter(x => x !== l); } else if (q > av.sellable) { toast('Only ' + av.sellable + ' available', true); return; } else l.qty = q; refresh(); },
  remove(el) { U.cart = U.cart.filter(x => x.productId !== el.dataset.id); refresh(); },
  startCheckout() {
    if (U.reservationId) E.releaseReservation(U.reservationId);
    const r = E.reserve(U.cart); if (!r.ok) { U.cartError = r.message + (r.shortages ? ' ' + r.shortages.map(s => s.name + ' (need ' + s.need + ', have ' + s.have + ')').join(', ') : ''); refresh(); return; }
    U.reservationId = r.reservation.id; U.cartError = null; U.checkoutError = null; save(); go('#checkout');
  },
  releaseRes() { if (U.reservationId) E.releaseReservation(U.reservationId); U.reservationId = null; save(); },
  trackThis(el) { U.trackId = el.dataset.id; },
  regAgain() { U.regResult = null; U.regForm = {}; render(); },
  adjust(el) { const sku = el.dataset.sku, d = Number(el.dataset.d), st = E.itemStock(sku); const b = d < 0 ? (st.batches.find(x => !x.expired && x.onHand >= -d) || st.batches[0]) : (st.batches.find(x => !x.expired) || st.batches[0]); openModal({ type: 'adjust', sku, delta: d, batchId: b.id }); },
  batches(el) { U.inv.open[el.dataset.sku] = !U.inv.open[el.dataset.sku]; render(true); },
  invClear() { U.inv.search = ''; U.inv.type = 'all'; U.inv.status = 'all'; render(true); },
  writeoff(el) { openModal({ type: 'confirm', title: 'Write off expired stock?', text: 'The remaining units of this batch leave stock and are recorded in the ledger as a write-off.', act: 'doWriteoff', id: el.dataset.id, confirm: 'Write off' }); },
  doWriteoff(el) { const r = E.writeOff(el.dataset.id, 'Expired stock written off', roleName()); closeModal(); refresh(); toast(r.ok ? 'Written off ' + (-r.entry.qty) + ' units' : r.message, !r.ok); },
  poFrom(el) { const sid = el.dataset.id, lines = E.reorderAlerts().filter(a => a.supplier.id === sid).map(a => ({ sku: a.sku, qty: a.suggested })); const r = E.createPO(sid, lines); refresh(); toast(r.ok ? 'Purchase order ' + r.po.id + ' created' : r.message, !r.ok); },
  receivePO(el) { openModal({ type: 'receivePO', id: el.dataset.id }); },
  ordFilter(el) { U.ord.status = el.dataset.id; U.ord.limit = 40; render(true); },
  ordMore() { U.ord.limit = (U.ord.limit || 40) + 40; render(true); },
  orderOpen(el) { U.ord.open = U.ord.open === el.dataset.id ? null : el.dataset.id; render(true); },
  orderTo(el) { const r = E.transition(el.dataset.id, el.dataset.to, roleName()); closeModal(); refresh(); toast(r.ok ? el.dataset.id + ' is now ' + r.order.status : r.message, !r.ok); },
  confirmCancel(el) { openModal({ type: 'confirm', title: 'Cancel order ' + el.dataset.id + '?', text: 'Stock returns to its original batches and any pending commission on this order is reversed. This cannot be undone.', act: 'orderTo', id: el.dataset.id, to: 'cancelled', confirm: 'Cancel order' }); },
  board(el) { U.inf.board = el.dataset.id; render(true); },
  trigger(el) { E.setSetting('commissionTrigger', el.dataset.id); U.settingsMsg = { ok: true, text: el.dataset.id === 'signup' ? 'Commission is now earned on registration.' : 'Commission is now earned on the first paid order.' }; refresh(); },
  infOpen(el) { U.inf.sel = el.dataset.id; render(true); const t = document.getElementById('infDetail'); if (t) t.scrollIntoView({ block: 'start' }); },
  infClose() { U.inf.sel = null; render(true); },
  infStatus(el) { E.setInfluencerStatus(el.dataset.id, el.dataset.s); refresh(); toast('Influencer is now ' + el.dataset.s); },
  codeStatus(el) { E.setCodeStatus(el.dataset.id, el.dataset.s); refresh(); toast('Code ' + el.dataset.s); },
  newCode(el) { openModal({ type: 'newCode', id: el.dataset.id }); },
  visitLink(el) { U.role = 'shopper'; save(); go('#join-' + el.dataset.code); },
  approve(el) { const r = E.approveEntry(el.dataset.id); refresh(); toast(r.ok ? 'Entry approved' : r.message, !r.ok); },
  approveAll(el) { const r = E.approveAllPending(el.dataset.id); refresh(); toast(r.count + ' entries approved'); },
  reverse(el) { openModal({ type: 'reverse', id: el.dataset.id }); },
  payout(el) { openModal({ type: 'payout', id: el.dataset.id }); },
  salesAll() { U.sales.source = 'all'; render(true); },
  copyText(el) { copyText(el.dataset.text, 'Link copied'); },
  copyCsv() { const st = E.influencerStats(infRange()); const head = 'name,type,clicks,signups,referred_orders,referred_revenue,earned,pending,approved,paid'; const rows = st.rows.map(r => [r.influencer.name, r.influencer.type, r.clicks, r.signups, r.orders, r.revenue, r.earned, r.pending, r.approved, r.paid].map(v => /[,"]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')); copyText([head].concat(rows).join('\n'), 'Aggregate CSV copied'); }
};
const roleName = () => U.role === 'staff' ? 'Staff' : U.role === 'founder' ? 'Founder' : 'Ops team';

const CHANGE = {
  role(el) { ACT.role(el.value); },
  invFilter(el) { U.inv[el.name] = el.value; render(true); },
  salesSource(el) { U.sales.source = el.value; render(true); },
  infRange(el) { U.inf.range = el.value; render(true); }
};
const FORMS = {
  applycode(form) { const code = fd(form).code; const v = E.validateCode(code); U.codeMsg = v.ok ? { ok: true, text: 'Code ' + v.code.code + ' is valid and applied. It will follow you to registration.' } : { ok: false, text: v.message }; if (v.ok) { U.pendingCode = v.code.code; U.regForm.code = v.code.code; } refresh(); },
  checkout(form, ev) {
    const d = fd(form); U.form = d; const res = E.placeOrder({ reservationId: U.reservationId, customer: { name: d.name, email: d.email, phone: d.phone }, userId: U.userId, paymentResult: d.paymentResult, sourceArea: U.cartArea || U.entry || 'shop', by: 'Shopper' });
    if (!res.ok) { U.checkoutError = res; if (res.error === 'reservation_expired') { U.reservationId = null; } refresh(); return; }
    U.checkoutError = null; U.lastOrderId = res.order.id; U.trackId = res.order.id; U.cart = []; U.reservationId = null; U.form = {}; if (res.order.userId) U.userId = res.order.userId; save(); go('#confirmation');
  },
  track(form) { U.trackId = fd(form).id.trim(); render(true); },
  register(form, ev) {
    const d = fd(form), skip = ev.submitter && ev.submitter.name === 'skip'; U.regForm = { name: d.name, email: d.email, phone: d.phone, code: d.code };
    const res = E.register({ name: d.name, email: d.email, phone: d.phone, code: d.code, deviceMarker: U.deviceMarker, continueWithoutCode: skip });
    U.regResult = res; if (res.ok) { U.userId = res.user.id; U.pendingCode = null; U.regForm = {}; } save(); render(true);
  },
  invfilter(form) { const d = fd(form); U.inv.search = d.search; render(true); },
  defaultrule(form) { const d = fd(form); const r = E.setSetting('defaultCommission', { fixed: d.fixed, percent: d.percent }); U.settingsMsg = r.ok ? { ok: true, text: 'Defaults saved. They apply to influencers without their own rate, from now on.' } : { ok: false, text: r.message }; refresh(); },
  newinf(form) {
    const d = fd(form); const hasF = d.fixed !== '', hasP = d.percent !== '';
    const r = E.createInfluencer({ name: d.name, type: d.type, handle: d.handle, email: d.email, phone: d.phone, code: d.code, commission: hasF || hasP ? { fixed: hasF ? Number(d.fixed) : null, percent: hasP ? Number(d.percent) : null } : null });
    U.inf.createMsg = r.ok ? { ok: true, text: r.influencer.name + ' was created' + (r.code ? ' with code ' + r.code.code : '') + '.' } : { ok: false, text: r.message }; if (r.ok) U.inf.sel = r.influencer.id; refresh();
  },
  adjust(form) { const d = fd(form); const r = E.adjust({ sku: U.modal.sku, batchId: d.batchId, delta: d.delta, reason: d.reason, note: d.note, by: roleName() }); if (!r.ok) { U.modal = Object.assign({}, U.modal, { error: r.message, batchId: d.batchId, delta: d.delta, reason: d.reason }); renderModal(); return; } closeModal(); refresh(); toast('Adjustment saved to the ledger'); },
  reverse(form) { const r = E.reverseEntry(U.modal.id, fd(form).reason); if (!r.ok) { U.modal.error = r.message; renderModal(); return; } closeModal(); refresh(); toast('Entry reversed'); },
  payout(form) {
    const d = fd(form), q = E.payoutQueue().find(x => x.influencer.id === U.modal.id); const key = 'ui-' + U.modal.id + '-' + (q ? q.entries.map(e => e.id).join('.') : 'none');
    const r = E.recordPayout(U.modal.id, d.reference, toMs(d.date, true), key); if (!r.ok) { U.modal.error = r.message; renderModal(); return; } closeModal(); refresh(); toast('Payout ' + r.payout.id + ' marked paid');
  },
  receivePO(form) {
    const d = fd(form), po = E.purchaseOrders().find(p => p.id === U.modal.id);
    const recs = po.lines.map(l => ({ sku: l.sku, lot: d['lot_' + l.sku], mfg: toMs(d['mfg_' + l.sku]), expiry: toMs(d['exp_' + l.sku]) }));
    const r = E.receivePO(po.id, recs); if (!r.ok) { U.modal.error = r.message; renderModal(); return; } closeModal(); refresh(); toast(po.id + ' received into stock');
  },
  newCodeFor(form) { const r = E.createCode(U.modal.id, fd(form).code); if (!r.ok) { U.modal.error = r.message; renderModal(); return; } closeModal(); refresh(); toast('Code ' + r.code.code + ' added'); }
};
const LIVE = {
  regcode(el) { const t = document.getElementById('regCodeMsg'); if (t) t.innerHTML = codeMsgHtml(el.value); },
  newcode(el) { const t = document.getElementById('newCodeMsg'); if (!t) return; if (!el.value.trim()) { t.innerHTML = ''; return; } const c = E.createCodeCheck(el.value); t.innerHTML = c.ok ? `<div class="msg good">${esc(c.code)} is available.</div>` : `<div class="msg bad">${esc(c.message)}</div>`; },
  modalcode(el) { const t = document.getElementById('modalCodeMsg'); if (!t) return; if (!el.value.trim()) { t.innerHTML = ''; return; } const c = E.createCodeCheck(el.value); t.innerHTML = c.ok ? `<div class="msg good">${esc(c.code)} is available.</div>` : `<div class="msg bad">${esc(c.message)}</div>`; }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); const tgt = ev.target;
  if (!el) { return; }
  track(tgt, ev);
  const fn = ACT[el.dataset.act]; if (fn) { const isLink = el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href').startsWith('#'); if (!isLink) ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('click', ev => { const a = ev.target.closest('a[href^="#"], button, [data-area]'); if (a && !ev.target.closest('[data-act]')) track(ev.target, ev); });
document.addEventListener('change', ev => { const el = ev.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el); });
document.addEventListener('input', ev => { const el = ev.target.closest('[data-live]'); if (el && LIVE[el.dataset.live]) LIVE[el.dataset.live](el); });
document.addEventListener('submit', ev => { const f = ev.target.closest('[data-form]'); if (!f) return; ev.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f, ev); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && U.modal) closeModal(); });
window.addEventListener('hashchange', () => { U._focused = false; U.modal = null; render(); window.scrollTo(0, 0); });
setInterval(() => {
  if (!current || current.name !== 'checkout') return; const r = U.reservationId && E.reservation(U.reservationId); if (!r) return;
  const rem = r.expiresAt - E.now(); const t = document.getElementById('timer');
  if (rem <= 0 || r.status !== 'active') { render(); return; } if (t) t.textContent = Math.floor(rem / 60000) + ':' + String(Math.floor(rem / 1000) % 60).padStart(2, '0');
}, 1000);

/* copy fallback modal */
const _modalHtml = modalHtml;
modalHtml = function () {
  const m = U.modal; if (m && m.type === 'copy') return `<div class="overlay" data-act="closeModal" data-overlay="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="row sb"><h3 id="mTitle">Copy this text</h3><button class="chip" data-act="closeModal">Close</button></div><p class="muted">Your browser blocked the copy button. Select the text and copy it.</p><textarea id="copyArea" rows="8" readonly>${esc(m.text)}</textarea></div></div>`;
  return _modalHtml();
};

loadUI(); initEngine();
if (U.role === 'influencer' && !E.influencer(U.infId)) U.role = 'shopper';
try { if (!sessionStorage.getItem('cofoco-session')) { sessionStorage.setItem('cofoco-session', '1'); E.startSession(U.entry || 'shop'); } } catch (e) { }
save(); render();


</script>

</body></html>
